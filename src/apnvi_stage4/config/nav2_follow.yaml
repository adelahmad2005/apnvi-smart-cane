# Nav2 for Stage 4: the route FOLLOWER (Adel, 11 Nov: Nav2's built-in Regulated Pure Pursuit).
# Stage 3's planner_server still plans the route (apnvi_stage3/config/nav2_params.yaml, not
# changed). This file adds only the follower (controller_server), its small moving obstacle
# map (local_costmap) and a lifecycle manager that starts it. No behaviour tree: the guide
# node asks the planner for a route every second and hands it to the follower.
# The follower's speeds go to /cmd_vel_nav -> hazard gate -> drive link -> master ESP32.

controller_server:
  ros__parameters:
    controller_frequency: 10.0          # 10 speed commands a second (Adel, 11 Nov)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5       # two side wheels: it cannot move sideways
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3     # must move 30 cm...
      movement_time_allowance: 20.0     # ...in 20 s (it waits at hazards), else re-sent
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.5            # arrival within about 0.5 m (Adel, 11 Nov)
      yaw_goal_tolerance: 6.28          # any facing is fine on arrival
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5           # top speed 0.5 m/s (Adel, 11 Nov; may change)
      lookahead_dist: 1.0               # aim 1.0 m ahead (23 Nov: 1.2 cut corners, 0.8 zigzagged)
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.4   # 23 Nov: 0.6 -> 0.4 (Adel: turns too quick to follow)
      use_rotate_to_heading: true       # turn on the spot first if the route points away
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0            # 23 Nov: 0.8 -> 3.0: it builds a turn from the measured
                                        # turning speed, which jittered, so its turn kept falling to 0
                                        # (60 s of on/off at a door). The drive link sets the power.
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.8   # slow down over the last 0.8 m
      use_collision_detection: true     # stop if the next second would hit something
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true   # slower in sharp turns
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      allow_reversing: false            # never back into the user
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true              # a 4 m x 4 m square that moves with the device
      width: 4
      height: 4
      resolution: 0.05
      # 22 Nov: 0.25 -> 0.21 m. The wheels are 0.41 m across outside (0.367 m centre to centre
      # + one 42 mm tyre), so 0.205 m from the axle to each side. With 0.25 m here and 0.25 m
      # in the planner (Stage 3), a route 25 cm from a wall already counted as touching: the
      # 19 Nov demo had 490 "collision ahead" stops. The planner keeps 0.25 m, so a route has
      # 4 cm to spare for the map and the follower's view to disagree.
      robot_radius: 0.21
      plugins: ["obstacle_layer", "camera_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_min_range: 0.3       # ignore the device's own body (the user: scan_filter)
          raytrace_min_range: 0.3
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
      camera_layer:                     # what the camera sees low down: boxes, bags.
        # Its own layer, so the LiDAR (77 cm, above a low box) never clears the camera's marks.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: camera
        camera:
          topic: /camera/obstacle_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true            # "nothing there" clears the space
          max_obstacle_height: 2.0
          obstacle_min_range: 0.1
          raytrace_min_range: 1.3       # 15 Nov: closer than this the camera cannot see low things
          # (86 cm up, looking level): never clear there, so a box seen earlier stays marked
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

lifecycle_manager_follow:
  ros__parameters:
    autostart: true
    node_names: ["controller_server"]
